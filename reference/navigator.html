const D = JSON.parse("{\"meta\":{\"title\":\"sqlstyle.guide\",\"built\":\"2026-10-05\",\"ndocs\":7,\"ndata\":0,\"nassets\":0},\"docs\":{\"00-findings.md\":\"# Findings\\n\\nRanked by consequence \u00d7 likelihood. Ids are stable: never renumber.\\nEvery finding is **claim \u2192 evidence \u2192 consequence \u2192 fix**.\\n\\n| Id | Finding | Severity | Confidence |\\n|---|---|---|---|\\n| F-01 | The fork lagged upstream by 27 commits for five years | Medium | High |\\n| F-02 | Publishing the fork as-is would claim upstream's domain and analytics | Medium | High |\\n| F-03 | Jekyll would publish the agent files and run Liquid in `reference/` | Medium | Medium |\\n| F-04 | Four translations are missing a section; Italian is missing two | Low | High |\\n| F-05 | Seven branches are inherited upstream debris | Low | High |\\n\\n---\\n\\n## F-01 \u2014 The fork lagged upstream by 27 commits for five years\\n\\n**Claim.** Until 2026-10-05 the fork's default branch, `gh-pages`, sat at `44f5e91`\\n(2021-03-10). Upstream had moved on 27 commits to `70b612f` (2026-03-17). Those commits\\nadd eight translations (Arabic, French, Korean, Polish, Spanish, Turkish, Ukrainian,\\nVietnamese; the fork had seven), plus a documented join exception and an ISO-8601 date\\nfix in the English guide.\\n\\n**Evidence.**\\n```bash\\ngit rev-list --count 44f5e91..upstream/gh-pages      # 27\\ngit rev-list --count upstream/gh-pages..44f5e91      # 0 -- the fork had nothing of its own\\n```\\n\\n**Consequence.** Anyone reading the fork read a 2021 guide. This mattered little only\\nbecause the estate cites the public site (`https://www.sqlstyle.guide/`), not the fork\\n(see [03-estate](03-estate/01-translution-usage.md)).\\n\\n**Fix (done).** `main` was created from `upstream/gh-pages` as a pure fast-forward and\\nmade the default branch. A fork that holds no content changes should keep syncing. The\\nprocedure is in [01-fork-and-upstream.md](01-repository/01-fork-and-upstream.md).\\n\\n---\\n\\n## F-02 \u2014 Publishing the fork as-is would claim upstream's domain and analytics\\n\\n**Claim.** `CNAME` names `www.sqlstyle.guide`. `_config.yml:5` sets upstream's Google\\nAnalytics id, and `_config.yml:7` sets `url: https://www.sqlstyle.guide`.\\n\\n**Consequence.** If GitHub Pages were switched on for this fork, it would try to serve\\nupstream's custom domain, and visits would be reported into Simon Holywell's analytics\\nproperty. Pages is **off** today (`gh api repos/TransLution/sqlstyle.guide/pages` \u2192 404),\\nso nothing is happening yet.\\n\\n**Fix.** Do not enable Pages on this fork unless `CNAME`, `url` and `ga_code` are changed\\nfirst. That is a content divergence from upstream; record it in `AGENTS.md` if it is ever made.\\n\\n---\\n\\n## F-03 \u2014 Jekyll would publish the agent files and run Liquid in `reference/`\\n\\n**Claim.** The `github-pages` gem (`Gemfile`) enables jekyll-optional-front-matter by\\ndefault, so `.md` files with no front matter are rendered as pages and Liquid inside\\nthem is executed. That includes every page in `reference/`, `AGENTS.md`, `CLAUDE.md` and\\n`CHANGELOG.md`.\\n\\n**Consequence.** The agent contract and this reference would appear on the public site,\\nand any page quoting an include tag would pull the whole guide in, or break the build.\\n\\n**Fix (done, unverified).** `_config.yml` now ends with an `exclude:` block (from\\n`_config.yml:84`) listing those paths. **Confidence is Medium** because no Jekyll build has\\nbeen run against it: the machine this was written on has no Ruby. The pages here also\\navoid literal Liquid braces as a second line of defence. To clear this, run\\n`bundle exec jekyll build` and confirm `_site/` contains no `reference/`, `AGENTS`,\\n`CLAUDE` or `CHANGELOG` output.\\n\\n---\\n\\n## F-04 \u2014 Four translations are missing a section; Italian is missing two\\n\\n**Claim.** The English guide has 6 `##` and 18 `###` headings. German, Japanese,\\nPortuguese (BR) and Russian have 17 `###`, with no counterpart to *Column data types*.\\nItalian has 5 `##` and 17 `###`, with no *Overview* heading and no *Preferred formalisms*\\nsection. See [02-translations.md](02-site/02-translations.md) for the full table.\\n\\n**Consequence.** A reader of those languages gets a shorter guide than an English reader,\\nwith nothing on the page to say so.\\n\\n**Fix.** Upstream's to make (`AGENTS.md`, invariant 1). Raise it with\\n`treffynnon/sqlstyle.guide` if TransLution relies on a translation; today it relies on none.\\n\\n---\\n\\n## F-05 \u2014 Seven branches are inherited upstream debris\\n\\n**Claim.** `master` (2016), `nl-translation` (2017), `patch-1` to `patch-4` (2017) and\\n`robertopauletto-gh-pages` (2020) were copied when the repository was forked.\\n`robertopauletto-gh-pages` is fully contained in `main`. The others carry 1\u201329 commits\\nthat upstream never merged.\\n\\n**Consequence.** None. They are inert. They are listed so nobody mistakes them for\\nTransLution work.\\n\\n**Fix.** Deliberately left in place (decision 2026-10-05). Delete only if someone confirms\\nnothing on them is wanted.\\n\",\"README.md\":\"# sqlstyle.guide (TransLution fork) \u2014 reference\\n\\n**Start here, not with the source.**\\n\\nThis is TransLution's fork of [Simon Holywell's SQL style guide](https://www.sqlstyle.guide)\\n(`treffynnon/sqlstyle.guide`). It contains a Jekyll site: one English guide, fifteen\\ntranslations, a layout and a stylesheet. TransLution has made **no content changes** to\\nit. The fork exists so the guide sits inside the estate, beside the repositories whose\\nSQL it informs.\\n\\nDocumented against `main` at `70b612f` (upstream `gh-pages`, 2026-03-17).\\n\\n## Read in this order\\n\\n| Page | What it answers |\\n|---|---|\\n| [00-findings.md](00-findings.md) | What is wrong or surprising, ranked \u2014 read this first |\\n| [01-repository/01-fork-and-upstream.md](01-repository/01-fork-and-upstream.md) | Why `main` exists, what the other branches are, and how to sync from upstream |\\n| [02-site/01-build-and-wiring.md](02-site/01-build-and-wiring.md) | How the site is assembled, and the four places a language is wired |\\n| [02-site/02-translations.md](02-site/02-translations.md) | How far each translation lags the English source, measured |\\n| [03-estate/01-translution-usage.md](03-estate/01-translution-usage.md) | Where the estate uses this guide, and where TransLution's house style departs from it |\\n\\n`navigator.html` is a single-file, offline, browsable copy of everything here. It is\\n**generated** by `_build/publish.ps1`; never edit it by hand.\\n\\n## Scope\\n\\nIn scope: the repository, its branches, the build, the language wiring and translation\\nlag, and the guide's links to the rest of the estate.\\n\\nOut of scope, on purpose: restating the guide. The English source is\\n`_includes/sqlstyle.guide.md`; read it there. TransLution's own SQL conventions are in\\n`translution-wiki`, not here.\\n\\n## Counts\\n\\nEvery count below is of files git tracks on `main` at `70b612f` and **excludes\\n`reference/` and the TransLution agent files** (`AGENTS.md`, `CLAUDE.md`, `CHANGELOG.md`,\\n`.claude/`, `.gitattributes`). Upstream tracks **58** files: 16 guide sources in\\n`_includes/`, 16 language `index.md` stubs, 11 layout files (6 partials, 2 layouts,\\n3 inlined assets in `_includes/static/`), 5 files in `static/`, and 10 config, licence\\nand dev-environment files at the root.\\n\\n```bash\\ngit ls-files -- . ':!reference' ':!AGENTS.md' ':!CLAUDE.md' ':!CHANGELOG.md' ':!.claude' ':!.gitattributes' | wc -l\\n```\\n\\n## Checks\\n\\n```powershell\\n_harness\\\\Verify-Reference.ps1      # line anchors resolve, provenance stamp, no hard-coded paths\\n_harness\\\\Test-LanguageWiring.ps1   # every language: config, include, page, lower-case dir\\n_build\\\\publish.ps1                 # regenerate navigator.html\\n_build\\\\Install-Hooks.ps1           # once per clone: the pre-commit hook runs the above\\n```\\n\",\"01-repository/01-fork-and-upstream.md\":\"# Fork and upstream\\n\\n## What this repository is\\n\\n| | |\\n|---|---|\\n| GitHub | `TransLution/sqlstyle.guide`, public, a fork of `treffynnon/sqlstyle.guide` |\\n| Default branch | `main` (since 2026-10-05; previously `gh-pages`) |\\n| Content owner | Simon Holywell, upstream. CC BY-SA 4.0 (`LICENCE:3`) |\\n| TransLution content | none in the guide. TransLution owns only `reference/`, the agent files, the `.gitignore` header and the `exclude:` block in `_config.yml` |\\n| Published | no. GitHub Pages is not enabled on the fork; the live site is upstream's |\\n\\n## Branches\\n\\n```mermaid\\ngitGraph\\n  commit id: \\\"2015 upstream start\\\"\\n  branch fork-gh-pages\\n  commit id: \\\"44f5e91 (2021-03-10)\\\"\\n  checkout main\\n  merge fork-gh-pages\\n  commit id: \\\"27 upstream commits\\\"\\n  commit id: \\\"70b612f (2026-03-17)\\\"\\n```\\n\\n*Edges from `git merge-base --is-ancestor 44f5e91 upstream/gh-pages` (true). The fork was\\na strict ancestor of upstream, so `main` is the old `gh-pages` plus 27 upstream commits,\\nwith nothing dropped.*\\n\\n| Branch | State | Keep? |\\n|---|---|---|\\n| `main` | `70b612f` = `upstream/gh-pages` at creation; default; carries the TransLution artefacts | yes, the working line |\\n| `gh-pages` | `44f5e91`, the fork's frozen 2021 default | kept so the old default still resolves; nothing should target it |\\n| `master`, `nl-translation`, `patch-1`\u2026`patch-4`, `robertopauletto-gh-pages` | inherited from upstream at fork time; see [F-05](../00-findings.md) | left in place |\\n\\n## Why `main` and not `gh-pages`\\n\\nEvery other repository in the estate defaults to `main`, and the reference pattern\\ntargets the default branch. Upstream publishes from `gh-pages` because GitHub Pages used\\nto require that name. The fork does not publish, so the name served no purpose.\\n\\nIf the fork is ever published, set the Pages source to `main` in the repository settings.\\nDo not push to `gh-pages`. Read [F-02](../00-findings.md) first.\\n\\n## Syncing from upstream\\n\\nThe fork holds no content edits, so a sync should fast-forward everything except the\\nTransLution-owned paths. Do it on a branch, through a PR, like any other change:\\n\\n```bash\\ngit fetch upstream\\ngit checkout -b chore/sync-upstream origin/main\\ngit merge upstream/gh-pages\\n```\\n\\nExpect conflicts in at most two places, both TransLution's and both deliberately kept\\nsmall:\\n\\n- `_config.yml`: the `exclude:` block at the end of the file. Keep ours.\\n- `.gitignore`: the TransLution blocks above the\\n  `===== upstream \u2026 do not edit below this line =====` marker. Keep ours above the\\n  marker, and take theirs below it.\\n\\nThen run `reference\\\\_harness\\\\Test-LanguageWiring.ps1`, because upstream adds languages,\\nand re-measure [02-translations.md](../02-site/02-translations.md).\\n\",\"02-site/01-build-and-wiring.md\":\"# Build and language wiring\\n\\n## The build\\n\\nThe site is a static Jekyll site built by the `github-pages` gem (`Gemfile:2`), which pins\\nJekyll 3 and its plugins. The configured plugins are `jekyll-redirect-from` and\\n`jekyll-sitemap` (`_config.yml:23`). Markdown is kramdown in GFM mode.\\n\\n```bash\\nbundle install\\nbundle exec jekyll serve      # http://localhost:4040 (port from _config.yml)\\n```\\n\\n`flake.nix` and `.envrc` give a Nix dev shell with Ruby, for anyone who uses direnv.\\nNeither is needed on Windows.\\n\\n**Not run for this reference.** No Ruby was available on the machine that wrote it, so\\nthe build has not been executed against `70b612f` or against the `exclude:` block\\n([F-03](../00-findings.md)).\\n\\n## How a page is assembled\\n\\n```mermaid\\nflowchart LR\\n  cfg[\\\"_config.yml - langs\\\"] --\u003e nav[\\\"layout_partials/languages.html\\\"]\\n  idx[\\\"de/index.md - lang: de\\\"] --\u003e|include tag| inc[\\\"_includes/sqlstyle.guide.de.md\\\"]\\n  idx --\u003e|layout: default| lay[\\\"_layouts/default.html\\\"]\\n  lay --\u003e nav\\n  js[\\\"static/scripts.js\\\"] --\u003e|lower-cases the code| url[\\\"/de/\\\"]\\n```\\n\\n*Edges read from the files named. `de` stands for any language. English is the root\\n`index.md` including `_includes/sqlstyle.guide.md`.*\\n\\nEach language page is a stub of about a dozen lines: front matter (`layout`, `lang`,\\n`lang_title`, contributors) and one include tag that pulls the whole guide in from\\n`_includes/`. The guide sources contain **no** front matter and no Liquid. They are plain\\nmarkdown.\\n\\n## A language is four things that must agree\\n\\n| # | Where | Rule | Evidence |\\n|---|---|---|---|\\n| 1 | `_config.yml`, `langs:` | a key per code, with the local name and the English name | `_config.yml:27` |\\n| 2 | `_includes/` | `sqlstyle.guide.\u003ccode\u003e.md`; English is `sqlstyle.guide.md` | \u2014 |\\n| 3 | `\u003cdir\u003e/index.md` | front matter `lang: \u003ccode\u003e`, and an include of (2) | \u2014 |\\n| 4 | the directory name | the **lower-case** of the code: `pt-BR` \u2192 `pt-br/`, `zh-TW` \u2192 `zh-tw/` | `scripts.js:15` builds the URL with `toLowerCase()` |\\n\\nThe language menu is built from **every page with a `lang` front-matter key**\\n(`languages.html:1`), not from `_config.yml`. So a stray `lang:` on any page puts a\\nphantom entry in the menu, and a page whose code is missing from `langs:` shows up with\\na blank name.\\n\\nJekyll checks none of this. A broken piece produces a dead link or an empty label, not an\\nerror. `_harness/Test-LanguageWiring.ps1` checks all four in both directions. It passed\\nfor all 16 languages at `70b612f`.\\n\\n`ja/index.md` also carries `redirect_from: \\\"/jp\\\"`, the only redirect in the site.\\n\",\"02-site/02-translations.md\":\"# Translations \u2014 measured lag\\n\\nEvery translation is a **full copy** of the guide, not a diff. When upstream edits the\\nEnglish source (`_includes/sqlstyle.guide.md`), nothing marks the fifteen copies as\\nbehind. This page measures how far behind they are.\\n\\nMeasured at `70b612f`. The English source has had 44 commits; its last change was\\n`d1c856a` (2024-02-27, the join exception). It has **6 `##` and 18 `###` headings**.\\n\\n| Language | Include | Last changed | English commits since | `##` / `###` | Missing vs English |\\n|---|---|---|---|---|---|\\n| Arabic | `sqlstyle.guide.ar.md` | 2026-02-24 | 0 | 6 / 18 | \u2014 |\\n| Spanish | `sqlstyle.guide.es.md` | 2026-03-17 | 0 | 6 / 18 | \u2014 |\\n| French | `sqlstyle.guide.fr.md` | 2024-02-27 | 1 | 6 / 18 | \u2014 |\\n| Japanese | `sqlstyle.guide.ja.md` | 2024-02-27 | 1 | 6 / 17 | Column data types |\\n| Polish | `sqlstyle.guide.pl.md` | 2024-02-27 | 1 | 6 / 18 | \u2014 |\\n| Portuguese (BR) | `sqlstyle.guide.pt-BR.md` | 2024-02-27 | 1 | 6 / 17 | Column data types |\\n| Turkish | `sqlstyle.guide.tr.md` | 2024-02-27 | 1 | 6 / 18 | \u2014 |\\n| Ukrainian | `sqlstyle.guide.ua.md` | 2024-02-27 | 1 | 6 / 18 | \u2014 |\\n| Vietnamese | `sqlstyle.guide.vn.md` | 2024-02-27 | 1 | 6 / 18 | \u2014 |\\n| German | `sqlstyle.guide.de.md` | 2024-02-27 | 2 | 6 / 17 | Column data types |\\n| Italian | `sqlstyle.guide.it.md` | 2024-02-27 | 2 | 5 / 17 | Overview heading; Preferred formalisms |\\n| Korean | `sqlstyle.guide.ko.md` | 2024-02-27 | 2 | 6 / 18 | \u2014 |\\n| Russian | `sqlstyle.guide.ru.md` | 2024-02-27 | 2 | 6 / 17 | Column data types |\\n| Simplified Chinese | `sqlstyle.guide.zh.md` | 2024-02-27 | 4 | 6 / 18 | \u2014 |\\n| Traditional Chinese | `sqlstyle.guide.zh-TW.md` | 2024-02-27 | 4 | 6 / 18 | \u2014 |\\n\\n**How to read \\\"English commits since\\\".** It counts commits to the English file after the\\ntranslation's own last commit. Many translations were last touched by the same 2024-02-27\\nwhitespace sweep, so a low number is **not** proof the content is current. It bounds the\\nlag from below; it does not measure it. Missing sections were found by comparing heading\\ncounts, then reading the `###` lists side by side. A translation can match on headings and\\nstill lag inside a section.\\n\\n```bash\\nf=_includes/sqlstyle.guide.de.md\\nlast=$(git log -1 --format=%H -- $f)\\ngit log --oneline $last..HEAD -- _includes/sqlstyle.guide.md | wc -l   # English commits since\\ngrep -c '^## ' $f; grep -c '^### ' $f                                 # heading counts\\n```\\n\\nThese are upstream's to fix ([F-04](../00-findings.md)). TransLution uses none of the translations.\\n\",\"03-estate/01-translution-usage.md\":\"# How the estate uses this guide\\n\\nChecked on 2026-10-05 with an org-wide code search\\n(`gh search code sqlstyle --owner TransLution`) and by reading `estate.json`.\\n\\n## No code depends on this repository\\n\\nNo repository builds from it, submodules it, vendors it, or links to the fork's URL.\\nIt has no package, no artefact and no consumers. Changing or archiving it breaks nothing\\ndownstream.\\n\\n## `translution-wiki` cites the guide, through the public site\\n\\nAll 13 hits are in `TransLution/translution-wiki`, and every one points at the\\n**public site** (`https://www.sqlstyle.guide/`), never at this fork:\\n\\n| Wiki page | Role |\\n|---|---|\\n| `wiki/sources/sqlstyle-guide-holywell.md` | source summary. Records the author, the licence (CC BY-SA 4.0) and the ingestion date (2026-04-30) |\\n| `wiki/concepts/sql-style-conventions.md` | **TransLution's SQL house style.** Cites this guide alongside four others |\\n| `wiki/concepts/database-design-principles.md`, `custom-project-tables.md` | cite it on naming, including the `tbl_` prefix |\\n| `reference/01-estate/01-repository-map.md` | lists this repo as \\\"not TransLution product code; a fork\\\" |\\n| `reference/_data/repository-inventory.psv` | inventory row, still showing branch `gh-pages`, pushed 2021-03-10 |\\n\\nThe last row is now stale. The default branch is `main` and the repository was pushed on\\n2026-10-05. It refreshes the next time the wiki's estate inventory is regenerated; it is\\nnot edited from here.\\n\\n## Where TransLution's house style departs from this guide\\n\\nThe wiki adopts this guide's **upper-case keywords**, but departs from it on purpose in\\nat least two places:\\n\\n- **Keyword alignment.** The guide's \\\"river\\\", with keywords right-aligned to a shared\\n  boundary (`sqlstyle.guide.md:174`, joins at `sqlstyle.guide.md:257`), is rejected in\\n  favour of left-aligned keywords.\\n- **The `tbl_` prefix.** The guide treats it as an anti-pattern. TransLution keeps it for\\n  custom and legacy tables, for consistency with existing schemas.\\n\\nThe authoritative list is the wiki page itself, not this summary. **Read\\n`sql-style-conventions.md` before applying anything from this guide to TransLution SQL.**\\nWhere the two disagree, the house style wins.\\n\\n## Licence\\n\\nThe guide is CC BY-SA 4.0 (`LICENCE:3`). Citing and summarising it, as the wiki does, needs\\nattribution, and the wiki gives it. Copying substantial text into a TransLution document\\nmakes that document a derivative, which must carry the same licence. Keep house-style\\nmaterial as TransLution's own words, with links.\\n\",\"_harness/README.md\":\"# Harness\\n\\nExecutable checks for `reference/`. All of them are read-only, resolve paths from their own\\nlocation, and run on stock Windows PowerShell 5.1. Exit 0 = pass.\\n\\n## `Verify-Reference.ps1`\\n\\nThree mechanical checks, ported from TransLutionScanner:\\n\\n1. **Line anchors.** Every `file.ext:NNN` cited in `reference/*.md` still resolves, and the\\n   file is long enough to contain that line. The extension list covers what this reference\\n   cites: `.md`, `.yml`, `.html`, `.js`, among others.\\n2. **Provenance.** The `reference-stamp` in `AGENTS.md` is a commit that is an ancestor of `HEAD`.\\n3. **Portability.** No script under `reference/` hard-codes an absolute user path.\\n\\nAnchors match files by **basename**, so cite unique names: `sqlstyle.guide.md:174` works,\\nbut a line in a language `index.md` cannot be cited this way, because 16 files share that name.\\n\\n## `Test-LanguageWiring.ps1`\\n\\nThe riskiest change in this repository is adding or renaming a language. A language is\\nfour things that must agree, and Jekyll checks none of them:\\n\\n- the `langs:` key in `_config.yml`\\n- `_includes/sqlstyle.guide.\u003ccode\u003e.md`\\n- `\u003cdir\u003e/index.md`, with `lang: \u003ccode\u003e` and an include of that file\\n- a directory named in lower case, because `static/scripts.js` lower-cases the URL\\n\\nThe check runs in both directions. It also catches an include, or a page carrying\\n`lang:`, that the config does not know about.\\n\\nAt `70b612f`: 16/16 languages pass. It has been shown to fail when the wiring breaks.\\nIn a scratch copy (2026-10-05), renaming `pt-br/` to `pt-BR/` gave 1 failure and exit 1,\\nand setting `de/index.md` to `lang: xx` gave 2 failures and exit 1. The first case matters\\nbecause `Test-Path` is case-insensitive on NTFS: an earlier draft passed it, and would\\nhave shipped a 404 to the case-sensitive Pages host. The check now compares the real\\ndirectory name, case-sensitively.\\n\\n## Not covered\\n\\n- No Jekyll build. There was no Ruby on the machine that wrote this harness, so whether\\n  `_config.yml`'s `exclude:` block works is asserted, not tested (`00-findings.md`, F-03).\\n- Translation *content* lag. `02-site/02-translations.md` is a heading-level measurement,\\n  and its commands are in the page, not here.\\n\"},\"data\":{},\"assets\":{},\"roots\":{}}");

/* ---------- markdown ---------- */
/* esc() output is interpolated into "-delimited attributes as well as into

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
                          .replace(/'/g,'&#39;');
/* Only ever put a vetted scheme in an href. A markdown link inside a document

   is safe; a scheme has to be one of three. */
function safeUrl(u){
  const s = String(u).replace(/[\u0000-\u0020]/g,'');   // defeat "java\tscript:"
  const m = /^([a-z][a-z0-9+.\-]*):/i.exec(s);
  return (m && !/^(?:https?|mailto)$/i.test(m[1])) ? '#' : String(u);

const slug = s => s.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
/* ---------- wikilinks ----------
   An Obsidian vault wires its pages together with [[wikilinks]], which are
   not markdown -- a markdown renderer leaves them as literal text. Resolve
   them the way Obsidian does: by filename stem first, then by the
   frontmatter title, so [[Business Object Posting]] finds
   business-object-posting.md. */
const FM_RE = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/;
let WX = null;
function wx(){
  if(WX) return WX;
  WX = {path:{}, stem:{}, title:{}};
  Object.keys(D.docs).forEach(p=>{
    const lp = p.toLowerCase();
    WX.path[lp] = p;
    const stem = lp.split('/').pop().replace(/\.md$/,'');
    if(!(stem in WX.stem)) WX.stem[stem] = p;
    const fm = D.docs[p].match(FM_RE);
    if(fm){
      const t = fm[1].match(/^title:[ \t]*["']?(.+?)["']?[ \t]*$/m);
      if(t){ const k = t[1].trim().toLowerCase();
             if(!(k in WX.title)) WX.title[k] = p; }
    }

}
function wres(target){
  const X = wx();
  const t = target.trim().toLowerCase().replace(/\.md$/,'');
  if(!t) return null;
  // [[TL Selector]] must find tl-selector.md: Obsidian matches a link to a
  // filename with whitespace normalised to the file's own separator.
  const base = t.split('/').pop();
  const kb = base.replace(/\s+/g,'-');
  return X.path[t+'.md'] || X.path[t] || X.stem[base] || X.stem[kb]
      || X.title[t] || X.title[base] || null;
}
function wasset(n){

  return A[k] || A[k.split('/').pop()] || null;
}
const UNPIPE = t => t.split(String.fromCharCode(92)+'|').join('|');

function wikiHtml(m){
  const embed = m.charAt(0) === '!';
  const raw = UNPIPE(m.slice(embed ? 3 : 2, -2));
  const bar = raw.indexOf('|');
  const link  = (bar < 0 ? raw : raw.slice(0, bar)).trim();
  const alias = (bar < 0 ? ''  : raw.slice(bar + 1)).trim();
  const hash  = link.indexOf('#');
  const page  = (hash < 0 ? link : link.slice(0, hash)).trim();
  const anch  = (hash < 0 ? ''   : link.slice(hash + 1)).trim();

  if(embed){
    const a = wasset(page || link);
    if(a) return '<img class="wimg" src="'+a+'" alt="'+esc(alias||page)+'" loading="lazy">';
  }
  // [[#Heading]] -- a link within the page being rendered
  if(!page && anch)
    return '<a href="#'+slug(anch)+'" class="wl">'+esc(alias||anch)+'</a>';

  const p = wres(page);
  const label = alias || (anch ? page+' \u203a '+anch : page);
  if(!p) return '<span class="deadlink" title="unresolved wikilink">'
                +esc(label)+'</span>';
  return '<a class="wl" href="#docs/'+p+'" data-wiki="'+p
       + '" data-anchor="'+esc(anch)+'">'+esc(label)+'</a>';
}

function inline(s){
  // Wikilinks are lifted out BEFORE escaping, so wikiHtml can emit real HTML
  // without esc() mangling it, then dropped back in at the end.
  const slots = [];
  const keep = h => { slots.push(h); return '\u0000W'+(slots.length-1)+'\u0000'; };
  // Inline code is masked FIRST: a [[wikilink]] quoted in backticks is a
  // literal being talked about, not a link. log.md quotes historical
  // broken links that way and must keep showing them as text.
  s = s.replace(/`([^`\n]+)`/g,(m,c)=>keep('<code>'+esc(c)+'</code>'));
  s = s.replace(/!?\[\[[^\[\]\n]+?\]\]/g, m=>keep(wikiHtml(m)));
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,h)=>
    '<a href="'+h+'" data-link="'+h+'">'+t+'</a>');
  s = s.replace(/\\\|/g,'|');          // leftover table pipe escapes
  s = s.replace(/\u0000W(\d+)\u0000/g,(m,i)=>slots[+i]);
  return s;
}

/* Frontmatter is metadata, not body text. Rendered as a compact strip so the

function splitFm(src){
  const m = src.match(FM_RE);
  return m ? {fm:m[1], body:src.slice(m[0].length)} : {fm:null, body:src};
}
function fmBar(fm){
  if(!fm) return '';
  const keep = ['type','visibility','applies_to','last_updated','status','tags','promoted'];
  const out = [];
  fm.split(/\r?\n/).forEach(ln=>{
    const m = ln.match(/^([A-Za-z_]+):[ \t]*(.*)$/);
    if(!m) return;
    const k = m[1].toLowerCase();
    if(keep.indexOf(k) < 0) return;
    const v = m[2].trim().replace(/^["']|["']$/g,'');
    if(!v) return;
    out.push('<span class="fmk">'+esc(k.replace(/_/g,' '))+'</span>&nbsp;'+esc(v));

}
function md(src){
  const L = src.split(/\r?\n/); let o=[], i=0;
  const listStack=[];
  const closeLists=n=>{ while(listStack.length>n) o.push('</'+listStack.pop()+'>'); };
  while(i<L.length){
    let l=L[i];
    if(/^```/.test(l)){
      const lang=l.slice(3).trim(); i++; const buf=[];
      while(i<L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++; closeLists(0);
      if(lang==='mermaid'){
        // mermaid reads textContent, so escaping here is both safe and correct
        o.push('<pre class="mermaid">'+esc(buf.join('\n'))+'</pre>');
      } else {
        o.push('<pre><code class="lang-'+esc(lang)+'">'+esc(buf.join('\n'))+'</code></pre>');
      }
      continue;
    }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      closeLists(0);

      // first and restore it for inline() to consume.

                .map(c=>c.split(T).join(String.fromCharCode(92)+'|').trim()); };
      const head=cells(l); i+=2; const body=[];
      while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])) body.push(cells(L[i++]));
      o.push('<div class="tablewrap"><table><thead><tr>'+
        head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+

    }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ closeLists(0); o.push('<hr>'); i++; continue; }
    if(m=l.match(/^>\s?(.*)$/)){
      closeLists(0); const buf=[];
      while(i<L.length && (m=L[i].match(/^>\s?(.*)$/))){ buf.push(m[1]); i++; }
      o.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>'); continue;
    }
    if(m=l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/)){
      const depth=Math.floor(m[1].length/2)+1;
      const tag=/\d/.test(m[2])?'ol':'ul';
      while(listStack.length<depth) { o.push('<'+tag+'>'); listStack.push(tag); }
      closeLists(depth);
      let txt=m[3]; i++;
      while(i<L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*+]|\d+[.)])\s/.test(L[i])){

    }
    if(!l.trim()){ closeLists(0); i++; continue; }
    const buf=[l]; i++;
    while(i<L.length && L[i].trim() && !/^(#{1,5}\s|>|```|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(L[i]))
      buf.push(L[i++]);
    closeLists(0); o.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  closeLists(0);
  return o.join('\n');
}

/* A link is resolved twice: in doc-key space for #docs routing, and in disk

function joinPath(baseArr, href){

      // or a link like ../../../OtherRepo/x cancels itself and resolves
      // back inside this repository.
      if(base.length && base[base.length-1] !== '..') base.pop();
      else base.push('..');
    }

  // '..' in the link has to pop only 'wiki', leaving the '..' standing.
  if(D.roots && D.roots[pre]) return D.roots[pre].split('/').concat(seg.slice(1));

}

    // #docs/_data/foo.psv and report "Not found".
    if(/\.psv$/i.test(t)){
      const key=t.split('/').pop();
      if(D.data[key]){
        a.href='#data/'+key;
        a.addEventListener('click',e=>{ e.preventDefault(); location.hash='#data/'+key; });
        return;
      }
    }
    if(!D.docs[t]){
      // Not a mounted document, but usually a real file sitting beside the
      // navigator -- a script, CLAUDE.md, a config. Link to it on disk so
      // local browsing works instead of routing into a doc tree that has no
      // such page.
      a.href=safeUrl(disk); a.className='offdoc'; a.title='opens '+disk+' on disk';
      return;
    }
    a.href='#docs/'+t;
    a.addEventListener('click',e=>{ e.preventDefault(); location.hash='#docs/'+t; });
  });
  if(pendingAnchor){ scrollToAnchor(); }
  else { v.scrollIntoView({block:'start'}); window.scrollTo(0,0); }
  sidebar();
}

let pendingAnchor='';
function scrollToAnchor(){
  const id=slug(pendingAnchor); pendingAnchor='';
  if(!id) return;
  const el=document.getElementById(id);
  if(el) el.scrollIntoView({block:'start'});
  else window.scrollTo(0,0);
}

function showData(k){
  cur=k; const d=D.data[k], v=$('#view');
  if(!d){ v.innerHTML='<div class="empty">No dataset selected.</div>'; return; }
  const note = d.rows.length < d.total
    ? '<p style="color:var(--dim);font-size:13px">Showing the first '+d.rows.length+
      ' of '+d.total+' rows. Read <code>_data/'+esc(k)+'</code> for the full set.</p>' : '';
  v.innerHTML='<h1>'+esc(k)+'</h1>'+note+
    '<div class="tablewrap"><table><thead><tr>'+
    d.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
    d.rows.map(r=>'<tr>'+d.cols.map((_,i)=>'<td>'+esc(r[i]===undefined?'':r[i])+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
  window.scrollTo(0,0); sidebar();
}

function runSearch(q){
  const v=$('#view');
  if(!q || q.length<2){ v.innerHTML='<div class="empty">Type at least two characters.</div>'; return; }
  const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
  let out=[], n=0;
  Object.keys(D.docs).forEach(p=>{
    const lines=D.docs[p].split(/\r?\n/);
    lines.forEach((ln,i)=>{
      if(n>=180) return;
      rx.lastIndex=0;
      if(rx.test(ln)){
        n++;
        out.push('<div class="hit" data-go="'+p+'"><div class="p">'+esc(titleOf(p))+
          ' · line '+(i+1)+'</div><div class="s">'+
          esc(ln.trim()).replace(new RegExp(rx.source,'ig'),m=>'<mark>'+m+'</mark>')+'</div></div>');
      }
    });
  });
  v.innerHTML = out.length
    ? '<h1>'+n+' match'+(n===1?'':'es')+'</h1>'+out.join('')
    : '<div class="empty">Nothing found for “'+esc(q)+'”.</div>';
  v.querySelectorAll('.hit').forEach(h=>h.addEventListener('click',
    ()=>{ location.hash='#docs/'+h.dataset.go; }));
}

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''));
  const [t,...rest]=h.split('/'); const arg=rest.join('/');
  tab = ['docs','data','find'].includes(t) ? t : 'docs';
  document.querySelectorAll('nav button[data-t]').forEach(b=>
    b.classList.toggle('on', b.dataset.t===tab));
  sidebar();
  if(tab==='docs') showDoc(arg || (D.docs['README.md'] ? 'README.md' : Object.keys(D.docs)[0]));
  else if(tab==='data') showData(arg || Object.keys(D.data)[0]);
  else runSearch(arg||'');
}
document.querySelectorAll('nav button[data-t]').forEach(b=>
  b.addEventListener('click',()=>{ location.hash='#'+b.dataset.t; }));
$('#theme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : cur==='light' ? 'dark'
    : (matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('navtheme',next); }catch(e){}
  if(mermaidReady) drawDiagrams();
});
try{ const t=localStorage.getItem('navtheme');
  if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
// Diagrams. Degrades to the raw mermaid source if the CDN is unreachable (offline, air-gapped),
// which stays readable — that is deliberate, not a fallback worth hiding.
let mermaidReady=false;
function darkNow(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t) return t==='dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function drawDiagrams(){
  const nodes=[...document.querySelectorAll('pre.mermaid')];
  if(!nodes.length || !window.mermaid) return;
  for(const n of nodes){
    if(!n.dataset.src) n.dataset.src=n.textContent;   // keep source for re-theming
    else { n.textContent=n.dataset.src; n.removeAttribute('data-processed'); }
  }
  try{
    mermaid.initialize({startOnLoad:false, securityLevel:'strict',
                        theme: darkNow()?'dark':'default'});
    mermaidReady=true;
    mermaid.run({nodes});
  }catch(e){ /* leave the source visible */ }
}
addEventListener('hashchange',route); route();
</script></body></html>
